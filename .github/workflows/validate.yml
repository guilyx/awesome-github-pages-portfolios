# Runs on every pull request. Contributors get errors as inline annotations on
# the exact line of their data file, plus a summary in the "Checks" tab.
name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to diff against the base branch
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Validate entries (schema, duplicates, site online, repository exists)
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BASE_REF" ]; then
            npm run validate -- --online --base "origin/$BASE_REF"
          else
            npm run validate -- --online
          fi

      - name: Build the site
        run: npm run build:site
